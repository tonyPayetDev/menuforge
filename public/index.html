<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenuForge - Créez le menu de votre restaurant</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --input-bg: #1a1a1a;
      --primary: #e85d04;
      --secondary: #faa307;
      --text: #f5f5f5;
      --text-muted: #8a8a8a;
      --border: #2a2a2a;
    }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(232, 93, 4, 0.08) 0%, transparent 60%);
    }
    
    .container { max-width: 600px; margin: 0 auto; }
    
    h1 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      font-size: 36px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 40px;
    }
    
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 48px;
      border: 1px solid var(--border);
      transition: box-shadow 0.3s ease;
    }
    
    .card:hover {
      box-shadow: 0 0 60px rgba(232, 93, 4, 0.1);
    }
    
    .progress {
      display: flex;
      justify-content: space-between;
      margin-bottom: 40px;
      position: relative;
    }
    
    .progress::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 40px;
      right: 40px;
      height: 2px;
      background: var(--border);
    }
    
    .progress-bar {
      position: absolute;
      top: 20px;
      left: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.4s ease;
    }
    
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }
    
    .step-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .step.active .step-circle {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }
    
    .step.completed .step-circle {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }
    
    .step-label {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .step.active .step-label { color: var(--primary); }
    
    .step-content { display: none; animation: fadeIn 0.4s ease; }
    .step-content.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .step-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 32px;
    }
    
    .form-group { margin-bottom: 20px; }
    
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }
    
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    textarea { resize: vertical; min-height: 100px; }
    
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(232, 93, 4, 0.05);
    }
    
    .dropzone-text { color: var(--text-muted); }
    .dropzone-preview { max-width: 150px; max-height: 150px; margin: 0 auto; border-radius: 8px; display: none; }
    .dropzone.has-preview .dropzone-text { display: none; }
    .dropzone.has-preview .dropzone-preview { display: block; }
    
    .menu-items { margin-top: 20px; }
    
    .menu-item {
      background: var(--input-bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    
    .menu-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .menu-item h4 { font-size: 14px; color: var(--primary); }
    
    .remove-btn {
      background: none;
      border: none;
      color: #ff4757;
      cursor: pointer;
      font-size: 18px;
    }
    
    .menu-item input { margin-bottom: 8px; }
    
    .add-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 2px dashed var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .add-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .day-checkbox {
      display: none;
    }
    
    .day-label {
      display: block;
      padding: 10px 8px;
      text-align: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s ease;
    }
    
    .day-checkbox:checked + .day-label {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    
    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .time-row label { margin-bottom: 4px; }
    
    .btn {
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }
    
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(232, 93, 4, 0.4);
    }
    
    .btn-secondary {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    
    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }
    
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    
    .btn-group .btn { flex: 1; }
    
    .format-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .format-option {
      display: none;
    }
    
    .format-label {
      display: block;
      padding: 16px;
      text-align: center;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .format-option:checked + .format-label {
      border-color: var(--primary);
      background: rgba(232, 93, 4, 0.1);
    }
    
    .format-label .name { font-weight: 600; margin-bottom: 4px; }
    .format-label .size { font-size: 12px; color: var(--text-muted); }
    
    .preview-canvas {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
      background: var(--input-bg);
    }
    
    .restaurant-list {
      margin-top: 40px;
      border-top: 1px solid var(--border);
      padding-top: 40px;
    }
    
    .restaurant-list h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 20px;
    }
    
    .restaurant-card {
      background: var(--input-bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .restaurant-logo {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }
    
    .restaurant-info { flex: 1; }
    .restaurant-info h3 { font-size: 16px; margin-bottom: 4px; }
    .restaurant-info p { font-size: 13px; color: var(--text-muted); }
    
    .restaurant-actions { display: flex; gap: 8px; }
    .restaurant-actions button {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }
    
    .btn-edit { background: var(--primary); color: white; }
    .btn-delete { background: #ff4757; color: white; }
    
    .hidden { display: none !important; }
    
    .error {
      color: #ff4757;
      font-size: 13px;
      margin-top: 4px;
    }
    
    @media (max-width: 600px) {
      .card { padding: 24px; }
      .days-grid { grid-template-columns: repeat(4, 1fr); }
      .format-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MenuForge</h1>
    <p class="subtitle">Créez le menu de votre restaurant</p>
    
    <div class="card">
      <div class="progress">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        <div class="step active" data-step="1">
          <div class="step-circle">1</div>
          <span class="step-label">Info</span>
        </div>
        <div class="step" data-step="2">
          <div class="step-circle">2</div>
          <span class="step-label">Menu</span>
        </div>
        <div class="step" data-step="3">
          <div class="step-circle">3</div>
          <span class="step-label">Horario</span>
        </div>
        <div class="step" data-step="4">
          <div class="step-circle">4</div>
          <span class="step-label">Générer</span>
        </div>
      </div>
      
      <form id="restaurantForm">
        <div class="step-content active" data-step="1">
          <h2 class="step-title">Informations du restaurant</h2>
          
          <div class="form-group">
            <label>Nom du restaurant *</label>
            <input type="text" name="name" placeholder="Le Petit Restaurant" required>
          </div>
          
          <div class="form-group">
            <label>Logo</label>
            <div class="dropzone" id="logoDropzone">
              <p class="dropzone-text">Cliquez ou glissez une image</p>
              <img class="dropzone-preview" id="logoPreview">
            </div>
            <input type="file" name="logo" id="logoInput" accept="image/*" class="hidden">
          </div>
          
          <div class="form-group">
            <label>Type de cuisine</label>
            <input type="text" name="cuisine" placeholder="Française, Italienne, ...">
          </div>
          
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" placeholder="Une description de votre restaurant..."></textarea>
          </div>
        </div>
        
        <div class="step-content" data-step="2">
          <h2 class="step-title">Le menu</h2>
          
          <div class="menu-items" id="menuItems"></div>
          
          <button type="button" class="add-btn" id="addMenuItem">+ Ajouter un plat</button>
        </div>
        
        <div class="step-content" data-step="3">
          <h2 class="step-title">Horarios</h2>
          
          <div class="form-group">
            <label>Jours d'ouverture</label>
            <div class="days-grid">
              <input type="checkbox" id="mon" name="days" value="lundi" class="day-checkbox">
              <label for="mon" class="day-label">Lun</label>
              
              <input type="checkbox" id="tue" name="days" value="mardi" class="day-checkbox">
              <label for="tue" class="day-label">Mar</label>
              
              <input type="checkbox" id="wed" name="days" value="mercredi" class="day-checkbox">
              <label for="wed" class="day-label">Mer</label>
              
              <input type="checkbox" id="thu" name="days" value="jeudi" class="day-checkbox">
              <label for="thu" class="day-label">Jeu</label>
              
              <input type="checkbox" id="fri" name="days" value="vendredi" class="day-checkbox">
              <label for="fri" class="day-label">Ven</label>
              
              <input type="checkbox" id="sat" name="days" value="samedi" class="day-checkbox">
              <label for="sat" class="day-label">Sam</label>
              
              <input type="checkbox" id="sun" name="days" value="dimanche" class="day-checkbox">
              <label for="sun" class="day-label">Dim</label>
            </div>
          </div>
          
          <div class="form-group">
            <label>Déjeuner</label>
            <div class="time-row">
              <div>
                <label>Ouverture</label>
                <input type="time" name="lunchStart" value="12:00">
              </div>
              <div>
                <label>Fermeture</label>
                <input type="time" name="lunchEnd" value="14:30">
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label>Dîner</label>
            <div class="time-row">
              <div>
                <label>Ouverture</label>
                <input type="time" name="dinnerStart" value="19:00">
              </div>
              <div>
                <label>Fermeture</label>
                <input type="time" name="dinnerEnd" value="22:30">
              </div>
            </div>
          </div>
        </div>
        
        <div class="step-content" data-step="4">
          <h2 class="step-title">Générer l'image</h2>
          
          <div class="form-group">
            <label>Format</label>
            <div class="format-grid">
              <input type="radio" name="format" value="instagram" id="fmtInstagram" class="format-option" checked>
              <label for="fmtInstagram" class="format-label">
                <div class="name">Instagram</div>
                <div class="size">1080 × 1080</div>
              </label>
              
              <input type="radio" name="format" value="facebook" id="fmtFacebook" class="format-option">
              <label for="fmtFacebook" class="format-label">
                <div class="name">Facebook</div>
                <div class="size">1200 × 630</div>
              </label>
              
              <input type="radio" name="format" value="story" id="fmtStory" class="format-option">
              <label for="fmtStory" class="format-label">
                <div class="name">Story</div>
                <div class="size">1080 × 1920</div>
              </label>
            </div>
          </div>
          
          <canvas id="previewCanvas" class="preview-canvas"></canvas>
          
          <div class="btn-group">
            <button type="button" class="btn btn-secondary" id="btnBack">Retour</button>
            <button type="button" class="btn btn-primary" id="btnDownload">Télécharger</button>
          </div>
        </div>
        
        <div class="btn-group" id="navButtons">
          <button type="button" class="btn btn-secondary hidden" id="btnPrev">Précédent</button>
          <button type="button" class="btn btn-primary" id="btnNext">Suivant</button>
        </div>
      </form>
      
      <div class="restaurant-list">
        <h2>Mes restaurants</h2>
        <div id="restaurantsList"></div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      currentStep: 1,
      totalSteps: 4,
      menuItems: [],
      logoData: null,
      currentRestaurant: null,
      editingId: null
    };
    
    const steps = document.querySelectorAll('.step');
    const stepContents = document.querySelectorAll('.step-content');
    const progressBar = document.getElementById('progressBar');
    const menuItemsContainer = document.getElementById('menuItems');
    const logoDropzone = document.getElementById('logoDropzone');
    const logoInput = document.getElementById('logoInput');
    const logoPreview = document.getElementById('logoPreview');
    const form = document.getElementById('restaurantForm');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');
    const btnBack = document.getElementById('btnBack');
    const btnDownload = document.getElementById('btnDownload');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    
    function updateProgress() {
      steps.forEach((step, i) => {
        step.classList.remove('active', 'completed');
        if (i + 1 < state.currentStep) step.classList.add('completed');
        if (i + 1 === state.currentStep) step.classList.add('active');
      });
      
      stepContents.forEach(content => {
        content.classList.remove('active');
        if (parseInt(content.dataset.step) === state.currentStep) {
          content.classList.add('active');
        }
      });
      
      const progress = ((state.currentStep - 1) / (state.totalSteps - 1)) * 100;
      progressBar.style.width = `calc(${progress}% - ${progress * 0.8}px)`;
      
      btnPrev.classList.toggle('hidden', state.currentStep === 1);
      document.getElementById('navButtons').classList.toggle('hidden', state.currentStep === 4);
    }
    
    function goToStep(step) {
      if (step < 1 || step > state.totalSteps) return;
      state.currentStep = step;
      updateProgress();
      
      if (step === 4) {
        generatePreview();
      }
    }
    
    btnNext.addEventListener('click', () => {
      if (state.currentStep === 1) {
        const name = form.name.value.trim();
        if (!name) {
          alert('Veuillez entrer le nom du restaurant');
          return;
        }
      }
      
      if (state.currentStep === 2) {
        if (state.menuItems.length === 0) {
          alert('Veuillez ajouter au moins un plat au menu');
          return;
        }
      }
      
      goToStep(state.currentStep + 1);
    });
    
    btnPrev.addEventListener('click', () => goToStep(state.currentStep - 1));
    btnBack.addEventListener('click', () => goToStep(3));
    
    logoDropzone.addEventListener('click', () => logoInput.click());
    logoDropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      logoDropzone.classList.add('dragover');
    });
    logoDropzone.addEventListener('dragleave', () => {
      logoDropzone.classList.remove('dragover');
    });
    logoDropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      logoDropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        handleLogo(e.dataTransfer.files[0]);
      }
    });
    logoInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleLogo(e.target.files[0]);
    });
    
    function handleLogo(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        state.logoData = e.target.result;
        logoPreview.src = e.target.result;
        logoDropzone.classList.add('has-preview');
      };
      reader.readAsDataURL(file);
    }
    
    function addMenuItem() {
      const id = Date.now();
      state.menuItems.push({ id, name: '', description: '', price: '' });
      renderMenuItems();
    }
    
    function removeMenuItem(id) {
      state.menuItems = state.menuItems.filter(item => item.id !== id);
      renderMenuItems();
    }
    
    function renderMenuItems() {
      menuItemsContainer.innerHTML = state.menuItems.map((item, index) => `
        <div class="menu-item">
          <div class="menu-item-header">
            <h4>Plat ${index + 1}</h4>
            <button type="button" class="remove-btn" onclick="removeMenuItem(${item.id})">×</button>
          </div>
          <input type="text" placeholder="Nom du plat" value="${item.name}" onchange="updateMenuItem(${item.id}, 'name', this.value)">
          <input type="text" placeholder="Description" value="${item.description}" onchange="updateMenuItem(${item.id}, 'description', this.value)">
          <input type="text" placeholder="Prix (ex: 18€)" value="${item.price}" onchange="updateMenuItem(${item.id}, 'price', this.value)">
        </div>
      `).join('');
    }
    
    window.updateMenuItem = function(id, field, value) {
      const item = state.menuItems.find(i => i.id === id);
      if (item) item[field] = value;
    };
    window.removeMenuItem = removeMenuItem;
    
    document.getElementById('addMenuItem').addEventListener('click', addMenuItem);
    
    function getFormData() {
      const days = Array.from(document.querySelectorAll('input[name="days"]:checked')).map(cb => cb.value);
      
      return {
        name: form.name.value,
        cuisine: form.cuisine.value,
        description: form.description.value,
        menu: state.menuItems,
        schedule: {
          days,
          lunch: {
            start: form.lunchStart.value,
            end: form.lunchEnd.value
          },
          dinner: {
            start: form.dinnerStart.value,
            end: form.dinnerEnd.value
          }
        }
      };
    }
    
    async function saveRestaurant() {
      const data = getFormData();
      
      const formData = new FormData();
      formData.append('name', data.name);
      formData.append('cuisine', data.cuisine);
      formData.append('description', data.description);
      formData.append('menu', JSON.stringify(data.menu));
      formData.append('schedule', JSON.stringify(data.schedule));
      
      if (logoInput.files.length) {
        formData.append('logo', logoInput.files[0]);
      }
      
      try {
        const url = state.editingId ? `/api/restaurants/${state.editingId}` : '/api/restaurants';
        const method = state.editingId ? 'PUT' : 'POST';
        
        const res = await fetch(url, {
          method: 'POST',
          body: formData
        });
        
        if (!res.ok) throw new Error('Erreur lors de la sauvegarde');
        
        const restaurant = await res.json();
        alert('Restaurant enregistré !');
        loadRestaurants();
        resetForm();
      } catch (err) {
        alert(err.message);
      }
    }
    
    function resetForm() {
      form.reset();
      state.menuItems = [];
      state.logoData = null;
      state.editingId = null;
      state.currentStep = 1;
      logoDropzone.classList.remove('has-preview');
      logoPreview.src = '';
      logoInput.value = '';
      renderMenuItems();
      updateProgress();
    }
    
    async function loadRestaurants() {
      try {
        const res = await fetch('/api/restaurants');
        const restaurants = await res.json();
        
        const list = document.getElementById('restaurantsList');
        if (restaurants.length === 0) {
          list.innerHTML = '<p style="color: var(--text-muted)">Aucun restaurant</p>';
          return;
        }
        
        list.innerHTML = restaurants.map(r => `
          <div class="restaurant-card">
            ${r.logo ? `<img src="${r.logo}" class="restaurant-logo">` : '<div class="restaurant-logo"></div>'}
            <div class="restaurant-info">
              <h3>${r.name}</h3>
              <p>${r.menu.length} plats</p>
            </div>
            <div class="restaurant-actions">
              <button class="btn-edit" onclick="editRestaurant('${r.id}')">Éditer</button>
              <button class="btn-delete" onclick="deleteRestaurant('${r.id}')">Supprimer</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }
    
    window.editRestaurant = async function(id) {
      const res = await fetch(`/api/restaurants/${id}`);
      const restaurant = await res.json();
      
      state.editingId = id;
      form.name.value = restaurant.name;
      form.cuisine.value = restaurant.cuisine || '';
      form.description.value = restaurant.description || '';
      
      state.menuItems = restaurant.menu || [];
      renderMenuItems();
      
      if (restaurant.schedule) {
        const days = restaurant.schedule.days || [];
        days.forEach(day => {
          const cb = document.querySelector(`input[name="days"][value="${day}"]`);
          if (cb) cb.checked = true;
        });
        if (restaurant.schedule.lunch) {
          form.lunchStart.value = restaurant.schedule.lunch.start || '';
          form.lunchEnd.value = restaurant.schedule.lunch.end || '';
        }
        if (restaurant.schedule.dinner) {
          form.dinnerStart.value = restaurant.schedule.dinner.start || '';
          form.dinnerEnd.value = restaurant.schedule.dinner.end || '';
        }
      }
      
      state.currentStep = 1;
      updateProgress();
    };
    
    window.deleteRestaurant = async function(id) {
      if (!confirm('Supprimer ce restaurant ?')) return;
      
      try {
        await fetch(`/api/restaurants/${id}`, { method: 'DELETE' });
        loadRestaurants();
      } catch (err) {
        alert('Erreur lors de la suppression');
      }
    };
    
    const formats = {
      instagram: { width: 1080, height: 1080 },
      facebook: { width: 1200, height: 630 },
      story: { width: 1080, height: 1920 }
    };
    
    function generatePreview() {
      const format = document.querySelector('input[name="format"]:checked').value;
      const { width, height } = formats[format];
      
      canvas.width = width;
      canvas.height = height;
      canvas.style.aspectRatio = `${width}/${height}`;
      
      const data = getFormData();
      
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, '#1a1a2e');
      gradient.addColorStop(1, '#16213e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      
      ctx.fillStyle = '#e85d04';
      ctx.fillRect(0, 0, width, 8);
      ctx.fillStyle = '#faa307';
      ctx.fillRect(0, height - 8, width, 8);
      
      let logoY = 60;
      if (state.logoData) {
        const img = new Image();
        img.onload = () => {
          const size = Math.min(120, width * 0.2);
          const x = (width - size) / 2;
          ctx.beginPath();
          ctx.roundRect(x, logoY, size, size, 16);
          ctx.clip();
          ctx.drawImage(img, x, logoY, size, size);
          ctx.restore();
          drawText(data, width, height, logoY + size + 40);
        };
        img.src = state.logoData;
      } else {
        drawText(data, width, height, logoY);
      }
    }
    
    function drawText(data, width, height, startY) {
      ctx.textAlign = 'center';
      
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.min(48, width * 0.08)}px Playfair Display, serif`;
      ctx.fillText(data.name || 'Mon Restaurant', width / 2, startY);
      
      if (data.cuisine) {
        ctx.fillStyle = '#faa307';
        ctx.font = `${Math.min(24, width * 0.04)}px DM Sans, sans-serif`;
        ctx.fillText(data.cuisine, width / 2, startY + 40);
      }
      
      if (data.menu && data.menu.length > 0) {
        const menuY = startY + 100;
        const itemHeight = Math.min(60, height * 0.06);
        const maxItems = Math.floor((height - menuY - 150) / itemHeight);
        const displayItems = data.menu.slice(0, maxItems);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        
        displayItems.forEach((item, i) => {
          const y = menuY + i * itemHeight;
          
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = `bold ${Math.min(22, width * 0.035)}px DM Sans, sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillText(item.name || 'Plat', 60, y);
          
          if (item.price) {
            ctx.textAlign = 'right';
            ctx.fillStyle = '#faa307';
            ctx.fillText(item.price, width - 60, y);
          }
          
          ctx.textAlign = 'left';
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.font = `${Math.min(16, width * 0.025)}px DM Sans, sans-serif`;
          if (item.description) {
            ctx.fillText(item.description.substring(0, 40), 60, y + 25);
          }
          
          if (i < displayItems.length - 1) {
            ctx.beginPath();
            ctx.moveTo(60, y + itemHeight / 2);
            ctx.lineTo(width - 60, y + itemHeight / 2);
            ctx.stroke();
          }
        });
      }
      
      if (data.schedule && data.schedule.days && data.schedule.days.length > 0) {
        const footerY = height - 100;
        
        ctx.fillStyle = '#8a8a8a';
        ctx.font = `${Math.min(18, width * 0.03)}px DM Sans, sans-serif`;
        ctx.fillText(data.schedule.days.join(' • '), width / 2, footerY);
        
        let hours = '';
        if (data.schedule.lunch && data.schedule.lunch.start) {
          hours += `Déj: ${data.schedule.lunch.start}-${data.schedule.lunch.end}`;
        }
        if (data.schedule.dinner && data.schedule.dinner.start) {
          hours += hours ? ' | ' : '';
          hours += `Dîner: ${data.schedule.dinner.start}-${data.schedule.dinner.end}`;
        }
        if (hours) {
          ctx.fillText(hours, width / 2, footerY + 30);
        }
      }
    }
    
    btnDownload.addEventListener('click', () => {
      const format = document.querySelector('input[name="format"]:checked').value;
      const link = document.createElement('a');
      link.download = `menu-${format}-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    
    document.querySelectorAll('input[name="format"]').forEach(input => {
      input.addEventListener('change', generatePreview);
    });
    
    addMenuItem();
    loadRestaurants();
    updateProgress();
  </script>
</body>
</html>
